<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Solaris Wine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo">SOLARIS WINE</div>
  <a href="index.html" class="back-link">← Back</a>
</header>

<section class="checkout-page">
  <div class="checkout-card">
    <h1>Confirm Your Order</h1>
    <p class="small-text">Fill in your details. We will confirm stock and send payment link / QR code.</p>

    <div class="form-grid">
      <input id="customerName" placeholder="Full Name">
      <input id="customerPhone" placeholder="Phone Number">
      <input id="customerLine" placeholder="LINE ID">
      <input id="customerWhatsapp" placeholder="WhatsApp Number">
      <textarea id="customerAddress" placeholder="Delivery Address"></textarea>
      <textarea id="customerNote" placeholder="Note"></textarea>
    </div>

    <h2>Order Summary</h2>
    <div id="checkoutItems"></div>
    <div class="cart-total">Total: <span id="checkoutTotal">0</span> THB</div>

    <textarea id="orderMessage" readonly></textarea>

    <div class="checkout-actions">
      <button onclick="generateOrder()">Generate Summary</button>
      <button onclick="copyOrder()">Copy Order</button>
      <button onclick="sendLine()">Send via LINE</button>
      <button onclick="sendWhatsApp()">Send via WhatsApp</button>
    </div>

    <p class="warning">LINE personal account: press Copy Order first, then paste and send in LINE.</p>
  </div>
</section>

<script src="app.js"></script>
<script>
  renderCheckout();
</script>

</body>
</html>
